[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api "com.github.jamestkhan.mundus:gdx-runtime:$mundusVersion"
  api "com.github.Dgzt:mundus-jolt-physics-plugin:$joltPhysicsPluginVersion"
  api("com.github.xpenatan.jParser:loader-core:$jParserLoaderVersion")
  api("com.github.xpenatan.xJolt:jolt-core:$gdxJoltVersion")
  api("com.github.xpenatan.xJolt:jolt-gdx:$gdxJoltVersion")

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }
}
